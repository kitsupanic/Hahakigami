name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The scanner uses macOS-only APIs (getattrlistbulk, clonefile, Trash).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm exec vite build
      - run: pnpm smoke
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p hahakigami --features performance-benchmark --all-targets -- -D warnings
      # The Lite edition: no default features, so no Automation scans (ADR 0007).
      - run: cargo clippy -p hahakigami --no-default-features --features lite --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p hahakigami --no-default-features --features lite
      - run: cargo test -p hahakigami --features performance-benchmark --lib performance
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
