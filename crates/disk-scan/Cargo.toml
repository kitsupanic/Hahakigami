[package]
name = "disk-scan"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kitsupanic/Hahakigami"
[features]
# Snapshot builders (set_children, replace_node) for other crates' tests.
test-support = []

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
# Already locked through tauri; matches names across NFC/NFD spellings.
icu_normalizer = { version = "=2.4.0", default-features = false, features = ["compiled_data"] }

[dev-dependencies]
serde_json = "1"
