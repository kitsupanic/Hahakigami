[package]
name = "hahakigami"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kitsupanic/Hahakigami"

[lib]
name = "hahakigami_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Cargo features only add, so the Full edition is the default and the Lite edition builds with
# `--no-default-features --features lite`. Automation scans (the CLI and the MCP server) are off in Lite.
default = ["automation"]
automation = ["dep:clap", "dep:rmcp", "dep:tokio"]
lite = []
performance-benchmark = ["tauri/test"]

[[example]]
name = "native_performance"
required-features = ["performance-benchmark"]

[[test]]
name = "automation_cli"
required-features = ["automation"]

[[test]]
name = "automation_mcp"
required-features = ["automation"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
disk-scan = { path = "../crates/disk-scan" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "=0.14.2"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
tauri-plugin-clipboard-manager = "=2.4.1"
clap = { version = "=4.6.7", features = ["derive"], optional = true }
rmcp = { version = "=3.7.0", default-features = false, features = ["server", "macros", "transport-io"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"], optional = true }
# Already locked through tauri; matches names across NFC/NFD spellings.
icu_normalizer = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow", "NSPanel", "NSApplication", "NSEvent", "NSWorkspace"] }
objc2-quick-look-ui = { version = "0.3", default-features = false, features = ["std", "objc2-app-kit", "QLPreviewPanel", "QLPreviewItem"] }
objc2-foundation = { version = "0.3", features = ["NSFileManager", "NSURL", "NSError", "NSString", "NSArray"] }

[dev-dependencies]
disk-scan = { path = "../crates/disk-scan", features = ["test-support"] }
tauri = { version = "2", features = ["test"] }
tempfile = "3"
rmcp = { version = "=3.7.0", default-features = false, features = ["client", "transport-child-process"] }
