<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" fill="none" stroke="#8f8670" stroke-opacity=".24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
